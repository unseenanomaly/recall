<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Recall: AI memory that forgets on purpose">
  <title>Recall: AI memory that forgets on purpose</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#171236"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#E9D5FF"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="18%" cy="50%" r="55%">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#fff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#glowL)"/>
  <rect width="1280" height="360" rx="22" fill="url(#dots)"/>

  <!-- mark -->
  <g transform="translate(70 40) scale(1.0)">
    <circle cx="128" cy="128" r="70" fill="url(#halo)"/>
    <circle cx="128" cy="128" r="104" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 17" opacity="0.5"/>
    <circle cx="128" cy="128" r="80" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-dasharray="44 12 14 12 4 12" stroke-dashoffset="20" opacity="0.72"/>
    <circle cx="128" cy="128" r="56" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="300 52" stroke-dashoffset="-30"/>
    <circle cx="128" cy="128" r="26" fill="url(#core)"/>
    <circle cx="119" cy="119" r="7" fill="#fff" opacity="0.55"/>
    <circle cx="214" cy="62" r="5" fill="#22D3EE" opacity="0.65"/>
    <circle cx="230" cy="46" r="3.4" fill="#22D3EE" opacity="0.42"/>
    <circle cx="241" cy="34" r="2.2" fill="#22D3EE" opacity="0.25"/>
  </g>

  <!-- wordmark -->
  <text x="372" y="190" font-family="'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="118" font-weight="800" letter-spacing="-3" fill="url(#word)">Recall</text>
  <text x="376" y="238" font-family="'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="30" font-weight="500" fill="#C4B5FD">AI memory that forgets on purpose.</text>

  <!-- chips -->
  <g font-family="'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">
    <rect x="376" y="270" width="132" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.16" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="442" y="295" text-anchor="middle" fill="#DDD6FE">AGES</text>
    <rect x="522" y="270" width="214" height="38" rx="19" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="629" y="295" text-anchor="middle" fill="#A5F3FC">DETECTS CONTRADICTIONS</text>
    <rect x="750" y="270" width="178" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.16" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="839" y="295" text-anchor="middle" fill="#DDD6FE">CURATES</text>
  </g>
</svg>
