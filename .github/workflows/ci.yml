name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Demo smoke test
        run: python -m recall demo
      - name: Examples
        shell: bash
        run: for f in examples/*.py; do python "$f" > /dev/null; done
      - name: Install into every agent and back out (throwaway home)
        shell: bash
        run: |
          export RECALL_HOME="$RUNNER_TEMP/rh"
          recall install --all --home "$RUNNER_TEMP/home"
          recall agents --home "$RUNNER_TEMP/home"
          recall uninstall --all --home "$RUNNER_TEMP/home"
          test -z "$(find "$RUNNER_TEMP/home" -type f)"

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check the generated JS/TS plugins
        run: |
          node --check .opencode/plugins/recall.mjs
          node --check .opencode/plugins/index.js
          cp integrations/pi/recall.ts /tmp/pi.mts && node --experimental-strip-types --check /tmp/pi.mts
          cp integrations/openclaw/index.ts /tmp/oc.mts && node --experimental-strip-types --check /tmp/oc.mts
